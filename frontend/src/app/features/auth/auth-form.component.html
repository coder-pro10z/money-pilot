<div class="auth-container">

  <h2>{{ title }}</h2>

  <form [formGroup]="form" (ngSubmit)="submit.emit()">

    <!-- Email -->
   <div class="form-group">

  <label>Email</label>

  <input
    type="email"
    formControlName="email"
    placeholder="Enter email"
  />

  <div  class="error" *ngIf="form.controls['email'].touched && form.controls['email'].invalid">

  <small *ngIf="form.controls['email'].errors?.['required']">
    Email is required
  </small>

  <small *ngIf="form.controls['email'].errors?.['email']">
    Invalid email format
  </small>

</div>
  <!-- <div class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">

    <small *ngIf="form.controls.email.errors?.['required']">
      Email is required
    </small>

    <small *ngIf="form.controls.email.errors?.['email']">
      Invalid email format
    </small>

  </div> -->

</div>

    <!-- Password -->
    <div class="form-group">

  <label>Password</label>

  <input
    type="password"
    formControlName="password"
    placeholder="Enter password"
  />
<div class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">

  <small *ngIf="form.get('password')?.errors?.['required']">
    Password is required
  </small>

  <small *ngIf="form.get('password')?.errors?.['minlength']">
    Minimum 6 characters required
  </small>

</div>
  <!-- <div class="error" *ngIf="form.controls.password.touched && form.controls.password.invalid">

    <small *ngIf="form.controls.password.errors?.['required']">
      Password is required
    </small>

    <small *ngIf="form.controls.password.errors?.['minlength']">
      Password must be at least 6 characters
    </small>

  </div> -->

</div>

    <!-- <button type="submit" [disabled]="form.invalid">
      {{ buttonText }}
    </button> -->

    <button
        type="submit"
        [disabled]="form.invalid || form.pending"
        class="submit-btn">
    {{ buttonText }}
    </button>
    <!-- optional footer slot -->
    <ng-content></ng-content>

  </form>

</div>
